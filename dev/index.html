<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Diver</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1><img class="logo" src="favicon.svg" alt="" width="20" height="20"> JSON Diver</h1>
</header>

<main>
  <!-- Hidden text mirror: holds the canonical serialized JSON used by Copy /
       Download / Format / undo history / desktop save. Visible input is the Raw
       editor in the tree pane. -->
  <section id="dropzone" hidden>
    <textarea id="input" spellcheck="false"></textarea>
  </section>

  <div class="content">
    <div class="tree-block">
      <div class="tree-toolbar">
        <div class="data-actions">
          <button id="btn-sample" type="button">Sample</button>
          <button id="btn-paste" type="button">Paste</button>
          <button id="btn-format" type="button" disabled>Format</button>
          <button id="btn-copy" type="button" disabled>Copy</button>
          <button id="btn-download" type="button" disabled>Download</button>
          <button id="btn-clear" type="button">Clear</button>
        </div>
        <div class="mode-actions">
          <div id="mode-switch" class="mode-switch" data-mode="view" role="group" aria-label="モード切替">
            <div class="mode-thumb" aria-hidden="true"></div>
            <button class="mode-opt" data-mode="view" type="button">View</button>
            <button class="mode-opt" data-mode="edit" type="button">Edit</button>
            <button class="mode-opt" data-mode="raw" type="button">Raw</button>
          </div>
          <button id="btn-undo" type="button" disabled title="Undo (Ctrl+Z)">↶ Undo</button>
          <button id="btn-redo" type="button" disabled title="Redo (Ctrl+Shift+Z)">Redo ↷</button>
          <button id="violation-badge" type="button" class="violation-badge" hidden title="スキーマ違反"></button>
        </div>
      </div>
      <div id="error" class="error" hidden></div>
      <div id="depth-bar" class="depth-bar" aria-label="階層別の開閉"></div>
      <div class="tree-scroll">
        <section id="tree" class="tree" aria-label="JSON tree"></section>
      </div>
    </div>
    <aside class="sidebar" aria-label="Reference">
      <div class="legend">
        <div class="legend-title">型アイコン</div>
        <ul class="legend-list">
          <li><span class="icon t-object">{}</span><span class="legend-name">object</span><span class="legend-ex">{}, {3}</span></li>
          <li><span class="icon t-array">[]</span><span class="legend-name">array</span><span class="legend-ex">[], [3]</span></li>
          <li><span class="icon t-string">🔤</span><span class="legend-name">string</span><span class="legend-ex val-string">"hello"</span></li>
          <li><span class="icon t-number">🔢</span><span class="legend-name">number</span><span class="legend-ex val-number">42</span></li>
          <li><span class="icon t-boolean">☑</span><span class="legend-name">boolean</span><span class="legend-ex val-boolean">true</span></li>
          <li><span class="icon t-null">⭕</span><span class="legend-name">null</span><span class="legend-ex val-null">null</span></li>
          <li><span class="icon t-escaped">🪆</span><span class="legend-name">escaped JSON</span><span class="legend-ex val-escaped">click to zoom</span></li>
        </ul>
      </div>
      <div class="schema-panel">
        <div class="schema-title">スキーマ <span class="schema-status" id="schema-status"></span></div>
        <textarea id="schema-input" placeholder='{ "type": "object", "properties": {...} }' spellcheck="false"></textarea>
        <div id="schema-error" class="schema-error" hidden></div>
      </div>
      <div class="minimap-wrap">
        <div class="minimap-title">ミニマップ</div>
        <div class="minimap" id="minimap">
          <canvas id="minimap-canvas"></canvas>
          <div class="minimap-viewport" id="minimap-viewport"></div>
        </div>
      </div>
      <div class="app-info">
        <div class="app-info-ver">JSON Diver <span id="app-version">v0.3.1</span></div>
        <a class="app-link" href="https://json.kintoys.app" target="_blank" rel="noopener" data-external>json.kintoys.app</a>
        <a class="app-link" href="https://github.com/motohasystem/json-diver" target="_blank" rel="noopener" data-external>GitHub</a>
      </div>
    </aside>
  </div>
</main>

<div id="tooltip" class="tooltip" hidden></div>
<div id="modal-stack" class="modal-stack" aria-hidden="true"></div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="drop-overlay" aria-hidden="true"><div class="drop-overlay-label">JSON／ファイルをドロップ</div></div>

<script src="app.js"></script>
<script src="desktop.js"></script>
</body>
</html>
